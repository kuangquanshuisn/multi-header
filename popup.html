<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Multi Header · 请求头管理</title>
    <link rel="stylesheet" href="styles.css">
    <script src="popup.js" type="module"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><div class="brand-icon" aria-hidden="true">H<span>↗</span></div><div><h1>Multi Header<span class="version">v1.0</span></h1><p>多种参数，切换自如。</p></div></div>
        <div class="master-control"><span id="master-label">已启用</span><button id="master-toggle" class="switch" role="switch" aria-checked="true" aria-label="启用请求头修改" disabled><span></span></button></div>
      </header>
      <div class="workspace">
        <aside class="sidebar">
          <div class="section-label">工作环境<span id="environment-count">01</span></div>
          <nav id="environment-list" aria-label="选择生效环境"></nav>
          <button id="add-environment" class="add-environment" disabled><span>＋</span> 添加环境</button>
          <div class="sidebar-note"><span class="tiny-orbit">◎</span><p>一次只启用一个环境<br>切换即生效</p></div>
        </aside>
        <main>
          <div class="environment-heading"><div><div class="eyebrow">ENVIRONMENT / 请求配置</div><h2 id="environment-title">正在加载…</h2></div><div class="environment-actions"><button id="copy-environment" class="icon-button" title="复制环境" aria-label="复制环境" disabled>⧉</button><button id="rename-environment" class="icon-button" title="重命名环境" aria-label="重命名环境" disabled>✎</button><button id="delete-environment" class="icon-button danger" title="删除环境" aria-label="删除环境" disabled>×</button></div></div>
          <div class="scope-banner"><span class="scope-icon" aria-hidden="true">↗</span><div><strong>全局请求头</strong><p>对所有 HTTP / HTTPS 请求添加或覆盖以下参数</p></div><span class="protocol">HTTP<span>/</span>HTTPS</span></div>
          <div class="table-title"><h3>请求头参数 <span id="header-count">0</span></h3><span>同名 Key 自动覆盖</span></div>
          <div class="headers-table"><div class="table-head"><span>启用</span><span>KEY <small>参数名</small></span><span>VALUE <small>参数值</small></span><span></span></div><div id="header-list"></div></div>
          <button id="add-header" class="add-header" disabled><span>＋</span> 添加请求头</button>
          <div class="help-note"><span aria-hidden="true">ⓘ</span><p>Key 不区分大小写。修改自动保存，新请求立即使用当前环境。</p></div>
          <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
        </main>
      </div>
      <footer><div class="save-status"><span id="status-dot" class="status-dot"></span><span id="save-status" role="status" aria-live="polite">正在连接…</span></div><div class="footer-actions"><span class="local-label">配置仅保存在本机</span><button id="reload" title="重新加载配置">重新加载</button><button id="open-options" title="在完整页面中管理">展开 ↗</button></div></footer>
    </div>
    <dialog id="environment-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><form id="environment-form"><div class="dialog-eyebrow">WORKSPACE</div><h2 id="dialog-title">添加环境</h2><p id="dialog-description">为这组请求头设置一个好记的名字。</p><label for="environment-name">环境名称</label><input id="environment-name" maxlength="40" placeholder="例如：测试环境" autocomplete="off" required><p id="dialog-error" class="dialog-error" role="alert"></p><div class="dialog-buttons"><button id="dialog-cancel" type="button" class="button secondary">取消</button><button id="dialog-confirm" type="submit" class="button primary">添加环境</button></div></form></dialog>
  </body>
</html>
